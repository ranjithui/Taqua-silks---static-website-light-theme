<svg xmlns="http://www.w3.org/2000/svg" width="54" height="60" viewBox="0 0 54 60">
  <!-- Kanchipuram temple (kumbam) zari border — vertical repeat, spires point inward (right) -->
  <defs>
    <linearGradient id="zari" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8d6b22"/>
      <stop offset="40%"  stop-color="#f3d98b"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- zari selvedge -->
  <rect x="0" y="0" width="7" height="60" fill="url(#zari)" opacity="0.55"/>
  <rect x="10" y="0" width="1.4" height="60" fill="#D4AF37" opacity="0.8"/>
  <rect x="13.5" y="0" width="0.7" height="60" fill="#f3d98b" opacity="0.5"/>
  <!-- temple spire -->
  <path d="M17,0 L52,30 L17,60 Z" fill="url(#zari)" opacity="0.5"/>
  <path d="M17,9 L41,30 L17,51 Z" fill="none" stroke="#f3d98b" stroke-width="1" opacity="0.6"/>
  <circle cx="24" cy="30" r="2" fill="#f3d98b" opacity="0.85"/>
  <!-- rudraksha dots on the selvedge -->
  <g fill="#f3d98b" opacity="0.75">
    <circle cx="3.5" cy="15" r="1.5"/>
    <circle cx="3.5" cy="45" r="1.5"/>
  </g>
</svg>
