<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep royal violet silk texture with faint gold zari weave">
  <defs>
    <linearGradient id="fold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.00" stop-color="#1b0d2b"/>
      <stop offset="0.14" stop-color="#3a1a52"/>
      <stop offset="0.26" stop-color="#2c1440"/>
      <stop offset="0.40" stop-color="#4a2470"/>
      <stop offset="0.52" stop-color="#26123a"/>
      <stop offset="0.66" stop-color="#43205C"/>
      <stop offset="0.80" stop-color="#1f0f30"/>
      <stop offset="0.92" stop-color="#3a1a52"/>
      <stop offset="1.00" stop-color="#160a22"/>
    </linearGradient>
    <radialGradient id="amb" cx="0.7" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#5E2B97" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#160a22" stop-opacity="0"/>
    </radialGradient>
    <filter id="silk2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.02" numOctaves="4" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="100" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2" result="s"/>
      <feSpecularLighting in="n" surfaceScale="3" specularConstant="0.6" specularExponent="22" lighting-color="#c9a24a" result="sp">
        <feDistantLight azimuth="230" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="sp" in2="s" operator="in" result="spc"/>
      <feBlend in="s" in2="spc" mode="screen"/>
    </filter>
    <pattern id="zari2" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <path d="M0 8 H30 M0 22 H30" stroke="#D4AF37" stroke-opacity="0.045" stroke-width="1"/>
      <path d="M8 0 V30 M22 0 V30" stroke="#f3d98b" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="#160a22"/>
  <g filter="url(#silk2)">
    <rect x="-60" y="-60" width="1720" height="1320" fill="url(#fold2)"/>
    <path d="M-100 860 C320 700 640 980 1000 780 C1280 620 1460 840 1720 700 L1720 1280 L-100 1280 Z" fill="#3a1a52" opacity="0.5"/>
  </g>
  <rect width="1600" height="1200" fill="url(#zari2)"/>
  <rect width="1600" height="1200" fill="url(#amb)"/>
</svg>
