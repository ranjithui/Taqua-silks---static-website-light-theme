<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Zari buti: paisley (mango) motif with a small lotus bud — brocade scatter tile -->
  <defs>
    <g id="paisley">
      <path d="M0,34 C-20,16 -22,-14 -2,-28 C16,-40 40,-30 42,-8 C44,12 28,26 12,22 C0,19 -2,6 6,0 C12,-4 20,0 20,7"
            fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M4,10 C10,2 20,-2 28,-2" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.75"/>
      <circle cx="16" cy="-14" r="2.4" fill="#D4AF37"/>
      <circle cx="28" cy="-2"  r="1.6" fill="#D4AF37" opacity="0.8"/>
    </g>
    <g id="bud">
      <path d="M0,-12 C7,-6 7,4 0,12 C-7,4 -7,-6 0,-12 Z" fill="none" stroke="#D4AF37" stroke-width="1.3"/>
      <path d="M-11,0 C-5,-5 5,-5 11,0 C5,5 -5,5 -11,0 Z" fill="none" stroke="#D4AF37" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="2.2" fill="#D4AF37"/>
    </g>
  </defs>
  <g opacity="0.6">
    <use href="#paisley" transform="translate(45,50)"/>
    <use href="#paisley" transform="translate(135,140) rotate(180)"/>
    <use href="#bud" transform="translate(140,45)"/>
    <use href="#bud" transform="translate(45,140)"/>
  </g>
</svg>
