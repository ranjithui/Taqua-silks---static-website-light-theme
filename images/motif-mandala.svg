            fill="none" stroke="#D4AF37" stroke-width="0.9"/>
      <circle cx="0" cy="-190" r="3.2" fill="#D4AF37"/>
    </g>
    <g id="tip">
      <circle cx="0" cy="-299" r="4" fill="#D4AF37" opacity="0.6"/>
      <path d="M0,-286 L7,-272 L0,-258 L-7,-272 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
    </g>
    <g id="innerpetal">
