    <circle r="294" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
    <circle r="116" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <circle r="108" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
