<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="-310 -310 620 620">
  <!-- Lotus mandala medallion (kolam style) — large faint watermark -->
  <defs>
    <g id="petal">
      <path d="M0,-296 C46,-236 46,-166 0,-120 C-46,-166 -46,-236 0,-296 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.6"/>
